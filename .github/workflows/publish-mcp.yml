name: Publish MCP to npm

# Publishes the MCP server (mcp/) to npm as intune-settings-catalog-viewer-mcp whenever its
# code changes. Data updates never trigger this: the server reads data from this repo at
# runtime. Users run `npx -y intune-settings-catalog-viewer-mcp`, so they pick up a new
# version on their next client restart.
#
# Authenticates with npm trusted publishing (OIDC): the package's npm settings trust this
# workflow file in this repository, so no npm token or secret is stored anywhere.

on:
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - 'src/lib/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC)

concurrency:
  group: publish-mcp
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Lewis-Barry/IntuneSettingsCatalogViewer'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    env:
      PKG: intune-settings-catalog-viewer-mcp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: mcp/package-lock.json

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: Update npm
        run: npm install -g npm@11 --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Self-check
        run: npm run check

      # npm is the source of truth for the version: rebuild the current release and compare
      # bundles byte for byte. Only a real code change produces a new patch version.
      - name: Detect changes against the published version
        id: diff
        run: |
          LATEST=$(npm view "$PKG" version)
          npm version "$LATEST" --no-git-tag-version --allow-same-version
          npm run build
          npm pack "$PKG@$LATEST" --pack-destination "$RUNNER_TEMP" --silent
          tar -xzf "$RUNNER_TEMP/$PKG-$LATEST.tgz" -C "$RUNNER_TEMP"
          if cmp -s dist/server.js "$RUNNER_TEMP/package/dist/server.js"; then
            echo "No code changes since $LATEST — nothing to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            npm version patch --no-git-tag-version
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm publish
          echo "Published $PKG@$(node -p "require('./package.json').version")"
