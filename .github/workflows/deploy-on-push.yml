name: Deploy on Push

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'public/search-index.json'
      - 'public/oib-data.json'
      - 'LICENSE'
      - 'README.md'

permissions:
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Reuse Next.js compiler/bundler cache across runs (not the page output).
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.*') }}
          restore-keys: |
            nextjs-${{ hashFiles('package-lock.json') }}-

      # Uses the committed data files (no fetch step)
      - name: Build search index
        run: npx tsx scripts/build-search-index.ts

      # Offline self-checks — a broken diff engine, exporter or filter must not deploy.
      - name: Self-checks
        run: |
          npm run check-oib-diff
          npm run check-baseline-diff
          npm run check-changelog-export
          npm run check-changelog-summary
          npm run check-usage-filter
          npm run check-compliance
          npm run check-windows-compatibility
          npm run check-browser-data
          npm run check-search-worker
          npm run check-search-performance

      - name: Generate per-setting changelog JSON
        run: npx tsx scripts/generate-changelog-settings.ts

      - name: Build site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
